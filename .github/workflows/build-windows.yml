name: Build Windows App

on:
  push:
    tags:
      - 'v*' # 打 v 开头的 tag 触发正式构建并上传 Release
  workflow_dispatch: # 也可在 Actions 页面手动触发

# tag 触发时需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (tsc + vite + electron tsc)
        run: npm run build

      - name: Package (electron-builder dir target)
        run: npx electron-builder --win

      - name: Zip portable directory
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/XunzhiPDFEditor-portable-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xunzhi-pdf-editor-win-x64-portable
          path: release/XunzhiPDFEditor-portable-win-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/XunzhiPDFEditor-portable-win-x64.zip
